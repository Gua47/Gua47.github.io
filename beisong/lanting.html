<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>背诵闯关：兰亭集序</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/canvas-confetti/1.6.0/confetti.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script>
    // 兜底：若上面的 CDN 在国内网络未能加载 confetti，则用一个内嵌的轻量礼花实现，
    // 保证"礼花一定能动"，且即使彩带失败也绝不中断后续的报告按钮逻辑。
    if (typeof window.confetti === 'undefined') {
        window.confetti = function (opts) {
            opts = opts || {};
            const count = opts.particleCount || 30;
            const spread = opts.spread || 60;
            const angle = (opts.angle != null ? opts.angle : 90) * Math.PI / 180;
            const origin = opts.origin || { x: 0.5, y: 0.5 };
            const colors = opts.colors || ['#6b8e23', '#f4a460', '#4682b4', '#d9534f', '#9b59b6'];
            const cv = document.createElement('canvas');
            cv.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9999;';
            cv.width = window.innerWidth; cv.height = window.innerHeight;
            document.body.appendChild(cv);
            const ctx = cv.getContext('2d');
            const ps = [];
            for (let i = 0; i < count; i++) {
                const a = angle + (Math.random() - 0.5) * (spread * Math.PI / 180);
                const v = 6 + Math.random() * 8;
                ps.push({
                    x: origin.x * cv.width, y: origin.y * cv.height,
                    vx: Math.cos(a) * v, vy: -Math.sin(a) * v,
                    g: 0.18 + Math.random() * 0.1,
                    s: 5 + Math.random() * 5, life: 90 + Math.random() * 40,
                    c: colors[Math.floor(Math.random() * colors.length)],
                    rot: Math.random() * 6, vr: (Math.random() - 0.5) * 0.4
                });
            }
            let frame = 0;
            (function loop() {
                ctx.clearRect(0, 0, cv.width, cv.height);
                let alive = false;
                ps.forEach(p => {
                    if (p.life <= 0) return;
                    alive = true;
                    p.vy += p.g; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life--;
                    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
                    ctx.globalAlpha = Math.max(0, p.life / 60);
                    ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * 0.6);
                    ctx.restore();
                });
                frame++;
                if (alive && frame < 200) requestAnimationFrame(loop);
                else cv.remove();
            })();
        };
    }
    </script>
    
    <style>
        :root { --bg-color: #f4f1e6; --text-color: #333; --primary-color: #6b8e23; --border-color: #c9c4b4; --error-color: #d9534f; }
        body { background-color: var(--bg-color); color: var(--text-color); font-family: "PingFang SC", "STSong", serif; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; box-sizing: border-box; }
        
        /* 导航与进度 */
        .nav-header { width: 100%; max-width: 600px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .back-link { text-decoration: none; color: #666; font-size: 14px; cursor: pointer; }
        .progress-container { width: 100%; max-width: 600px; margin-bottom: 30px; position: relative; }
        .progress-line { height: 2px; background: var(--border-color); position: absolute; top: 15px; width: 100%; z-index: 1; }
        .progress-active { height: 2px; background: var(--primary-color); position: absolute; top: 15px; z-index: 2; transition: width 0.3s; }
        .nodes { display: flex; justify-content: space-between; position: relative; z-index: 3; }
        .node { width: 30px; height: 30px; background: var(--bg-color); border: 2px solid var(--border-color); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #999; cursor: pointer; transition: all 0.2s; }
        .node.active { border-color: var(--primary-color); color: var(--primary-color); font-weight: bold; background: #fff; }

        /* 正文区域 */
        #game-area { width: 100%; max-width: 600px; padding-bottom: 250px; position: relative; }
        .content-para { line-height: 2.5; font-size: 1.2rem; text-align: justify; text-indent: 2em; margin: 20px 0; }
        h2 { text-align: center; margin-bottom: 5px; letter-spacing: 4px; }
        .author { text-align: center; color: #666; font-size: 0.9rem; margin-bottom: 25px; }

        /* 挖空与填字状态 */
        .blank { display: inline-flex; align-items: center; justify-content: center; width: 1.6rem; height: 1.6rem; border-bottom: 2px solid #999; margin: 0 2px; vertical-align: middle; cursor: pointer; text-indent: 0; color: transparent; transition: all 0.2s; }
        .blank.active { border-bottom-color: var(--primary-color); background-color: rgba(107, 142, 35, 0.1); animation: breathe 1.2s infinite; }
        @keyframes breathe { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }
        .blank.filled { display: inline; border-bottom: none; color: var(--primary-color); font-weight: bold; width: auto; min-width: 1.2rem; height: auto; vertical-align: baseline; }
        .blank.wrong { color: var(--error-color) !important; font-weight: bold; border-bottom-color: var(--error-color); animation: shake 0.4s; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }

        /* 1-3关 底部选项卡 */
        #options-container { display: none; position: fixed; bottom: 0; left: 0; width: 100%; background: #fff; padding: 20px 0; border-top: 1px solid var(--border-color); justify-content: center; gap: 15px; z-index: 100; box-shadow: 0 -5px 15px rgba(0,0,0,0.05); }
        .option-btn { width: 55px; height: 55px; border: 2px solid var(--border-color); display: flex; align-items: center; justify-content: center; font-size: 1.2rem; background: #fff; border-radius: 8px; cursor: pointer; transition: all 0.2s; }
        .option-btn:active { background: #f0f0f0; border-color: #999; }

        /* 第4关专属 */
        #l4-container { display: none; width: 100%; flex-direction: column; align-items: center; }
        #l4-para-select { width: 100%; padding: 12px; font-size: 1.1rem; margin-bottom: 15px; border: 2px solid var(--border-color); border-radius: 8px; outline: none; background: #fff; color: var(--text-color); cursor: pointer; }
        #l4-textarea { width: 100%; height: 180px; padding: 15px; font-size: 1.1rem; border: 2px solid var(--border-color); border-radius: 8px; resize: none; margin-bottom: 10px; box-sizing: border-box; line-height: 1.8; font-family: inherit; }
        #l4-result-area { width: 100%; font-size: 1.2rem; line-height: 2.5; text-indent: 2em; text-align: justify; margin-bottom: 20px; display: none; }
        .l4-char-green { color: var(--primary-color); font-weight: bold; margin: 0 2px; }
        .l4-char-red { color: var(--error-color); font-weight: bold; margin: 0 2px; cursor: pointer; border-bottom: 2px dashed var(--error-color); padding-bottom: 2px; }
        .l4-char-miss { color: #aaa; margin: 0 2px; cursor: pointer; border-bottom: 2px dashed #aaa; padding-bottom: 2px; }
        .l4-inline-input { width: 2rem; height: 2rem; font-size: 1.1rem; text-align: center; border: 2px solid var(--error-color); color: var(--error-color); font-weight: bold; border-radius: 4px; outline: none; margin: 0 2px; vertical-align: middle; background: #fff; }
        
        .action-btn { width: 100%; max-width: 560px; padding: 12px 0; background: var(--primary-color); color: #fff; border: none; border-radius: 25px; font-size: 1.1rem; cursor: pointer; margin-top: 10px; transition: opacity 0.3s; }
        .secondary-btn { width: 100%; max-width: 560px; padding: 12px 0; background: #fff; color: #666; border: 1px solid var(--border-color); border-radius: 25px; font-size: 1rem; cursor: pointer; margin-top: 10px; display: none; }

        /* 第五关幽灵输入框 */
        #ghost-input {
    position: fixed;
    left: 50%;
    bottom: 8px;
    width: 1px;
    height: 1px;
    opacity: 0.01;
    border: none;
    background: transparent;
    color: transparent;
    caret-color: transparent;
    z-index: -1;
}
        #l5-tip-toast { display: none; position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.7); color: #fff; padding: 10px 20px; border-radius: 20px; font-size: 0.85rem; z-index: 100; white-space: nowrap; pointer-events: none; }

        /* 成功提示页面（带情绪缓冲） */
        #success-page { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(244, 241, 230, 0.98); z-index: 200; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        #success-page h1 { font-size: 2.2rem; color: var(--primary-color); margin-bottom: 20px; letter-spacing: 2px; }
        .next-btn { padding: 15px 40px; background: var(--primary-color); color: #fff; border: none; border-radius: 30px; font-size: 1.1rem; cursor: pointer; margin-top: 20px; }
        
        /* 错题报告全屏弹窗 */
        #summary-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-color); z-index: 999; overflow-y: auto; padding: 20px; box-sizing: border-box; }
        #report-capture-area { background: #fff; padding: 25px 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 30px; }
        #summary-title { font-size: 1.8rem; color: var(--primary-color); text-align: center; margin-top: 0; letter-spacing: 2px; }
        #summary-eval { text-align: center; color: #666; margin-bottom: 20px; font-size: 0.95rem; line-height: 1.6; }
        .report-para { line-height: 2.2; font-size: 1.1rem; text-align: justify; text-indent: 2em; margin: 15px 0; color: #444; }
        .hard-char { color: var(--error-color); font-weight: bold; border-bottom: 2px dashed var(--error-color); padding: 0 2px; }
        .btn-group { display: flex; flex-direction: column; gap: 12px; align-items: center; padding-bottom: 40px; }

        /* 成就卡（方案甲：独立一屏、干净可截图） */
        #achievement-page { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(244, 241, 230, 0.98); z-index: 250; flex-direction: column; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box; }
        #achievement-card { width: 100%; max-width: 360px; background: linear-gradient(160deg, #ffffff 0%, #f7f5ec 100%); border: 1px solid var(--border-color); border-radius: 20px; padding: 36px 28px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); text-align: center; }
        #ac-seal { font-size: 0.8rem; letter-spacing: 3px; color: var(--primary-color); border: 1px solid var(--primary-color); border-radius: 20px; display: inline-block; padding: 3px 14px; margin-bottom: 22px; }
        #ac-piece { font-size: 2rem; letter-spacing: 4px; color: var(--text-color); margin: 0 0 6px 0; font-weight: bold; }
        #ac-author { font-size: 0.85rem; color: #999; margin-bottom: 24px; }
        #ac-achieve { font-size: 1.15rem; color: var(--primary-color); font-weight: bold; margin-bottom: 18px; letter-spacing: 1px; }
        #ac-time { font-size: 0.95rem; color: #666; margin-bottom: 24px; }
        #ac-time strong { color: var(--text-color); font-size: 1.1rem; }
        #ac-quote { font-size: 1rem; color: #555; line-height: 1.7; padding: 16px 10px; border-top: 1px dashed var(--border-color); border-bottom: 1px dashed var(--border-color); margin-bottom: 18px; }
        #ac-date { font-size: 0.8rem; color: #aaa; letter-spacing: 1px; }
        .ac-btn-group { display: flex; flex-direction: column; gap: 12px; align-items: center; width: 100%; max-width: 360px; margin-top: 22px; }
        .ac-btn { width: 100%; padding: 13px 0; border-radius: 25px; font-size: 1rem; cursor: pointer; font-family: inherit; border: none; }
        .ac-btn-primary { background: #4682b4; color: #fff; }
        .ac-btn-ghost { background: #fff; color: var(--primary-color); border: 1px solid var(--primary-color); }

    </style>
</head>
<body>
    <div id="success-page">
        <h1 id="success-title">挑战成功🎉</h1>
        <p id="success-desc" style="margin-bottom: 30px; color: #666;">百尺竿头，更进一步</p>
        <button class="next-btn" onclick="closeSuccessPage()" id="success-next-btn">进入下一关</button>
        <button class="next-btn" onclick="openReport()" id="success-report-btn" style="display:none; background:#4682b4;">查看本次默写体检报告</button>
    </div>

    <!-- 成就卡（方案甲）：第5关全篇默写达成后，独立一屏，可截图分享 -->
    <div id="achievement-page">
        <div id="achievement-card">
            <span id="ac-seal">默写达成</span>
            <h1 id="ac-piece">兰亭集序</h1>
            <div id="ac-author">王羲之 〔魏晋〕</div>
            <div id="ac-achieve">✦ 全篇默写达成 ✦</div>
            <div id="ac-time">用时 <strong id="ac-time-val">--</strong></div>
            <div id="ac-quote">突破自己的记录，就是成功者。</div>
            <div id="ac-date" id="ac-date-val">2026.01.01</div>
        </div>
        <div class="ac-btn-group">
            <button class="ac-btn ac-btn-primary" onclick="saveAchievementCard()" id="ac-save-btn">💾 保存成就卡长图</button>
            <button class="ac-btn ac-btn-ghost" onclick="openReportFromCard()">查看完整报告</button>
        </div>
    </div>

    <div class="nav-header">
        <a onclick="goToLevel(1)" class="back-link">← 目录</a>
        <span id="level-title" style="font-size: 14px; color: #888;">正在练习：第一关</span>
    </div>

    <div class="progress-container">
        <div class="progress-line"></div>
        <div id="progress-active" class="progress-active"></div>
        <div class="nodes">
            <div class="node" onclick="goToLevel(1)">1</div>
            <div class="node" onclick="goToLevel(2)">2</div>
            <div class="node" onclick="goToLevel(3)">3</div>
            <div class="node" onclick="goToLevel(4)">4</div>
            <div class="node" onclick="goToLevel(5)">测</div>
        </div>
    </div>

    <div id="game-area">
        <h2>兰亭集序</h2>
        <div class="author">王羲之 〔魏晋〕</div>
        
        <div id="content-body"></div>

        <div id="l4-container">
            <select id="l4-para-select"></select>
            <textarea id="l4-textarea" placeholder="🎤 建议唤起语音输入本段内容..."></textarea>
            <div id="l4-result-area"></div>
            <button id="l4-check-btn" class="action-btn" onclick="checkL4Para()">核查本段</button>
            <button id="l4-reedit-btn" class="secondary-btn" onclick="reeditL4Para()">🔄 错位严重？重新编辑本段</button>
        </div>
    </div>

    <div id="options-container"></div>
    
    <input type="text" id="ghost-input" autocomplete="off" autocorrect="off" spellcheck="false" />
    <div id="l5-tip-toast">✍️ 建议切换手写输入，逐字默写。写对自动落格，写错不上屏（不影响心流）</div>

    <div id="summary-overlay">
        <div id="report-capture-area">
            <h1 id="summary-title">兰亭集序·默写报告</h1>
            <div id="summary-eval"></div>
            <div id="report-text-container"></div>
        </div>
        
        <div class="btn-group">
            <button class="secondary-btn" style="display:block; border-color: #4682b4; color: #4682b4; margin-top:0;" onclick="backToAchievement()">🏅 返回成就卡（可截图）</button>
            <button id="download-btn" class="action-btn" onclick="downloadReport()" style="background: #4682b4; margin-top:0;">💾 保存报告为长图</button>
            <button class="secondary-btn" style="display:block; border-color: var(--primary-color); color: var(--primary-color); margin-top:0;" onclick="goToLevel(5)">🔄 再测一次</button>
            <button class="secondary-btn" style="display:block; margin-top:0;" onclick="goToLevel(1)">🏠 返回目录 (重置进度)</button>
        </div>
    </div>

    <script>
        const rawParas = [
            "永和九年，岁在癸丑，暮春之初，会于会稽山阴之兰亭，修禊事也。群贤毕至，少长咸集。此地有崇山峻岭，茂林修竹；又有清流激湍，映带左右，引以为流觞曲水，列坐其次。虽无丝竹管弦之盛，一觞一咏，亦足以畅叙幽情。",
            "是日也，天朗气清，惠风和畅。仰观宇宙之大，俯察品类之盛，所以游目骋怀，足以极视听之娱，信可乐也。",
            "夫人之相与，俯仰一世，或取诸怀抱，悟言一室之内；或因寄所托，放浪形骸之外。虽趣舍万殊，静躁不同，当其欣于所遇，暂得于己，快然自足，不知老之将至。及其所之既倦，情随事迁，感慨系之矣。向之所欣，俯仰之间，已为陈迹，犹不能不以之兴怀。况修短随化，终期于尽。古人云：“死生亦大矣。”岂不痛哉！",
            "每览昔人兴感之由，若合一契，未尝不临文嗟悼，不能喻之于怀。固知一死生为虚诞，齐彭殇为妄作。后之视今，亦犹今之视昔，悲夫！故列叙时人，录其所述，虽世殊事异，所以兴怀，其致一也。后之览者，亦将有感于斯文。"
        ];

        const fullTextStr = rawParas.join("");
        const puncRegex = /[，。；？、〔〕“”\s！!：:《》〈〉（）()]/;
        const charPool = [...new Set(fullTextStr.replace(new RegExp(puncRegex, 'g'), "").split(''))];

        // 第1-3关易错字混淆表（兰亭专属，已人工审核定稿）：
        // 键=正确字，值=该字的精准干扰字（1-2个，必出）。表外的字走纯随机。
        const confusionMap = {
            "禊": ["楔", "契"],
            "觞": ["殇", "觥"],
            "激": ["击", "急"],
            "骋": ["聘", "逞"],
            "形": ["行"],
            "趣": ["取"],
            "躁": ["燥"],
            "己": ["已"],
            "慨": ["概"],
            "合": ["和"],
            "嗟": ["蹉"],
            "悼": ["棹"],
            "喻": ["谕", "俞"],
            "诞": ["涎"],
            "殇": ["觞", "伤"],
            "稽": ["嵇"],
            "作": ["做"],
            "坐": ["座"],
            "察": ["查"],
            "娱": ["愉"],
            "悟": ["晤"],
            "既": ["即"],
            "犹": ["尤"],
            "尝": ["常"],
            "固": ["故"],
            "叙": ["述"],
            "世": ["事"],
            "致": ["至"]
            // 注：「癸」开头不易错，不设精准干扰，走纯随机。
        };
        
        let currentLevel = 1;
        let allBlanks = [];
        let activeIndex = 0;
        
        let globalErrorCount = 0; 
        let l4CompletedStatus = [false, false, false, false];
        let l4ParagraphTexts = ["", "", "", ""]; 
        
        let l5MistakeMap = {}; 
        let l5ErrorTimer = null; 
        let l5TotalErrors = 0; 
        let l5AutoInputCount = 0;   // 第5关疑似联想/自动输入次数（数据出口用）
        let l5StartTime = null;     // 第5关计时起点（写下第一个字时才开始）
        let l5ElapsedSec = 0;       // 第5关达成时的纯书写用时（秒）

        function goToLevel(l) {
            document.getElementById('summary-overlay').style.display = 'none';
            document.getElementById('success-page').style.display = 'none';
            document.getElementById('achievement-page').style.display = 'none';
            currentLevel = l;
            initLevel(l);
        }

        function handleGlobalError() {
            globalErrorCount++;
            if (globalErrorCount >= 20 && currentLevel <= 3) {
                setTimeout(() => {
                    alert("哎呀，好像遇到瓶颈啦！当前关卡已经失误 20 次。“温故而知新”，咱们先退回上一关稳扎稳打吧！");
                    goToLevel(currentLevel > 1 ? currentLevel - 1 : 1);
                }, 100);
            }
        }

        function initLevel(level) {
            if (l5ErrorTimer) clearTimeout(l5ErrorTimer);
            globalErrorCount = 0;
            l5MistakeMap = {};
            l5TotalErrors = 0;
            l5AutoInputCount = 0;
            l5StartTime = null;
            l5ElapsedSec = 0;
            
            const body = document.getElementById('content-body');
            const l4Container = document.getElementById('l4-container');
            const opts = document.getElementById('options-container');
            const ghostInput = document.getElementById('ghost-input');
            const l5Toast = document.getElementById('l5-tip-toast');

            body.innerHTML = '';
            body.style.display = 'block';
            l4Container.style.display = 'none';
            opts.style.display = 'none';
            ghostInput.style.display = 'none';
            l5Toast.style.display = 'none';
            allBlanks = [];
            activeIndex = 0;

            document.getElementById('level-title').innerText = level === 5 ? "终极测评" : `正在练习：第${level}关`;
            document.querySelectorAll('.node').forEach((n, i) => n.classList.toggle('active', i < level));
            document.getElementById('progress-active').style.width = (level - 1) * 25 + '%';

            if (level <= 3) {
                opts.style.display = 'flex';
                renderStandardBody(level);
                refreshUI_L1to3();
            } else if (level === 4) {
                body.style.display = 'none'; 
                l4Container.style.display = 'flex';
                initL4Logic();
            } else if (level === 5) {
                ghostInput.style.display = 'block';
                l5Toast.style.display = 'block';
                renderStandardBody(level);
                initL5Logic();
            }
            // （临时测试入口已移除）
        }

        function renderStandardBody(level) {
            const body = document.getElementById('content-body');
            const gapRate = level <= 3 ? [0.4, 0.6, 0.8][level-1] : 1.0; 
            
            rawParas.forEach((para) => {
                const p = document.createElement('p');
                p.className = 'content-para';
                const chars = para.split('');
                chars.forEach(char => {
                    if (puncRegex.test(char)) {
                        p.appendChild(document.createTextNode(char));
                    } else {
                        if (Math.random() < gapRate || level === 5) {
                            const span = document.createElement('span');
                            span.className = 'blank';
                            span.dataset.ans = char;
                            span.innerText = char; 
                            p.appendChild(span);
                            allBlanks.push(span);
                        } else {
                            p.appendChild(document.createTextNode(char));
                        }
                    }
                });
                body.appendChild(p);
            });
        }

        // ================= 第1-3关：恢复底侧4选1功能 =================
        function refreshUI_L1to3() {
            if (activeIndex >= allBlanks.length) { triggerSuccess(); return; }
            allBlanks.forEach((b, i) => {
                b.classList.remove('active');
                if (i === activeIndex) {
                    b.classList.add('active');
                    b.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            });
            
            const correctChar = allBlanks[activeIndex].dataset.ans;
            // 挑干扰字：易错字表里的精准干扰"必出"，不足3个再从字库随机补足，凑满四选一
            const preset = (confusionMap[correctChar] || []).filter(c => c !== correctChar);
            const need = 3 - preset.length;
            const used = new Set([correctChar, ...preset]);
            const randomFill = charPool
                .filter(c => !used.has(c))
                .sort(() => Math.random() - 0.5)
                .slice(0, Math.max(0, need));
            const others = [...preset, ...randomFill];
            const options = [correctChar, ...others].sort(() => Math.random() - 0.5);

            const optsContainer = document.getElementById('options-container');
            optsContainer.innerHTML = '';
            
            options.forEach(char => {
                const btn = document.createElement('div');
                btn.className = 'option-btn';
                btn.innerText = char;
                btn.onclick = () => {
                    if (char === correctChar) {
                        allBlanks[activeIndex].innerText = char;
                        allBlanks[activeIndex].className = 'blank filled';
                        activeIndex++;
                        refreshUI_L1to3();
                    } else {
                        allBlanks[activeIndex].classList.add('wrong');
                        setTimeout(() => allBlanks[activeIndex].classList.remove('wrong'), 400);
                        handleGlobalError();
                    }
                };
                optsContainer.appendChild(btn);
            });
        }

        // ================= 第4关：分段双轨改错 =================
        let l4CurrentParaIndex = 0;

        function checkL4Para() {
            const rawPara = rawParas[l4CurrentParaIndex];
            const rawChars = rawPara.split('');
            const inputVal = document.getElementById('l4-textarea').value;
            l4ParagraphTexts[l4CurrentParaIndex] = inputVal; 
            
            const inputChinese = inputVal.replace(new RegExp(puncRegex, 'g'), "").split('');
            if (inputChinese.length === 0) { alert("输入为空，请先录入文本。"); return; }
            
            l4ParaData = [];
            let inputPointer = 0;

            rawChars.forEach((char) => {
                if (puncRegex.test(char)) {
                    l4ParaData.push({ isPunct: true, char: char });
                } else {
                    const userChar = inputPointer < inputChinese.length ? inputChinese[inputPointer] : "";
                    l4ParaData.push({
                        isPunct: false,
                        targetChar: char,
                        userChar: userChar,
                        isCorrect: userChar === char
                    });
                    inputPointer++;
                }
            });

            document.getElementById('l4-textarea').style.display = 'none';
            document.getElementById('l4-check-btn').style.display = 'none';
            document.getElementById('l4-reedit-btn').style.display = 'block';
            renderL4Result();
        }

        function renderL4Result() {
            const resultArea = document.getElementById('l4-result-area');
            resultArea.style.display = 'block';
            resultArea.innerHTML = '';
            let allCorrect = true;

            l4ParaData.forEach((item, index) => {
                if (item.isPunct) {
                    resultArea.appendChild(document.createTextNode(item.char));
                } else {
                    const span = document.createElement('span');
                    span.dataset.index = index; 
                    if (item.isCorrect) {
                        span.className = 'l4-char-green';
                        span.innerText = item.targetChar;
                    } else {
                        allCorrect = false;
                        span.className = item.userChar ? 'l4-char-red' : 'l4-char-miss';
                        span.innerText = item.userChar || "空";
                        span.onclick = () => openL4InlineInput(index, span);
                    }
                    resultArea.appendChild(span);
                }
            });

            if (allCorrect) {
                setTimeout(() => {
                    alert(`✅ 第 ${l4CurrentParaIndex + 1} 段背诵无误。`);
                    l4CompletedStatus[l4CurrentParaIndex] = true;
                    document.getElementById('l4-reedit-btn').style.display = 'none';
                    initL4Logic(); 
                }, 300);
            }
        }

        function openL4InlineInput(index, spanNode) {
            const input = document.createElement('input');
            input.type = 'text';
            input.className = 'l4-inline-input';
            input.setAttribute('autocomplete', 'off');
            input.setAttribute('autocorrect', 'off');
            input.setAttribute('spellcheck', 'false');

            spanNode.parentNode.replaceChild(input, spanNode);
            input.focus();

            input.oninput = () => {
                const val = input.value.replace(new RegExp(puncRegex, 'g'), "");
                if (val.length >= 1) {
                    checkL4Inline(index, val[val.length - 1], input);
                }
            };
        }

        function checkL4Inline(index, val, inputNode) {
            const target = l4ParaData[index].targetChar;
            if (val === target) {
                l4ParaData[index].userChar = val;
                l4ParaData[index].isCorrect = true;
                renderL4Result(); 
            } else {
                inputNode.value = '';
                inputNode.classList.add('wrong');
                setTimeout(() => inputNode.classList.remove('wrong'), 400);
            }
        }

        // ================= 第5关：手写全文默写（《种树》静默前缀模型 / 干净心流） =================
        // 核心理念（区别于旧的"指针+标红"）：
        // 1. 不用 activeIndex 逐格指针，改为维护"已确认写对的纯文字进度串" l5Progress。
        // 2. 每次输入事件，把输入框内容与正确答案做"前缀比对"（幂等），
        //    判对才落字、焦点前进；判错或 iOS 手写临时字，一律静默撤回、不上屏、不标红。
        //    —— 这从根上消除"未确认的临时字飞到下一格被判错"的现象。
        // 3. 兼容拼音(带前文整串)与手写(只带新字)两种上屏形态。
        const cjkRegex = /[\u3400-\u4dbf\u4e00-\u9fff\uf900-\ufaff]/g;

        let l5Progress = "";        // 已确认写对的纯汉字串（不含标点）
        let l5FullAnswer = "";      // 全篇正确纯汉字串（不含标点），供前缀比对
        let l5Composing = false;

        // 全篇纯汉字答案（按 allBlanks 顺序，即挖空顺序）
        function buildL5Answer() {
            l5FullAnswer = allBlanks.map(b => b.dataset.ans).join("");
        }

        // 依据已确认进度串，刷新横线显示：已写的填字变绿，下一格高亮，其余留空
        function renderL5(progressLen) {
            allBlanks.forEach((b, i) => {
                b.classList.remove('active', 'wrong');
                if (i < progressLen) {
                    b.className = 'blank filled';
                    b.style.color = '';
                    b.innerText = b.dataset.ans;
                } else {
                    b.className = 'blank';
                    b.style.color = '';
                    b.innerText = b.dataset.ans;   // 内容在，靠 color:transparent 隐藏
                    if (i === progressLen) {
                        b.classList.add('active');
                        b.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                }
            });
        }

    function initL5Logic() {
    const ghostInput = document.getElementById('ghost-input');
    buildL5Answer();
    l5Progress = "";
    l5Composing = false;
    ghostInput.value = "";
    renderL5(0);

    document.getElementById('game-area').onclick = () => {
        if (currentLevel === 5) ghostInput.focus();
    };

    setTimeout(() => ghostInput.focus(), 200);

    ghostInput.oncompositionstart = () => {
        l5Composing = true;
    };

    // 安卓手写关键修复：
    // 有些安卓输入法写对字后，字还停留在“合成中”，不会立刻触发 input。
    // 所以这里直接读取 e.data，让写对的字提前落格。
    ghostInput.oncompositionupdate = (e) => {
        validateL5(e.data || "", { countError: false });
    };

    ghostInput.oncompositionend = (e) => {
        l5Composing = false;
        validateL5(e.data || "");
    };

    ghostInput.oninput = (e) => {
        validateL5(e.data || "");
    };
}
        // 静默前缀判定：对了落字前进，错了/临时字静默撤回（核心）
        function validateL5(extraText = "", options = {}) {
    if (currentLevel !== 5) return;

    const ghostInput = document.getElementById('ghost-input');
    const countError = options.countError !== false;

    const fromInput = (ghostInput.value.match(cjkRegex) || []).join("");
    const fromEvent = (String(extraText).match(cjkRegex) || []).join("");

    const candidates = [];
    if (fromInput) candidates.push(fromInput);
    if (fromEvent) candidates.push(fromEvent);

    if (fromInput && fromEvent && fromInput !== fromEvent) {
        candidates.push(fromInput + fromEvent);
    }

    if (candidates.length === 0) {
        ghostInput.value = l5Progress;
        return;
    }

    let bestProgress = null;
    let isDuplicateSubmit = false;

    candidates.forEach(rawVal => {
        let candidateProgress = null;

        // 情况1：输入框带完整前缀，如“永和”
        if (l5FullAnswer.startsWith(rawVal)) {
            if (rawVal.length >= l5Progress.length) {
                candidateProgress = rawVal;
            }
        } else {
            const remainder = l5FullAnswer.substring(l5Progress.length);

            // 情况2：安卓/手写只提交新字，如“和”
            if (remainder.startsWith(rawVal)) {
                candidateProgress = l5Progress + rawVal;
            } else {
                const lastChar = rawVal.charAt(rawVal.length - 1);
                const expectedChar = l5FullAnswer.charAt(l5Progress.length);

                // 情况3：兜底，只看最后一个汉字
                if (lastChar === expectedChar) {
                    candidateProgress = l5Progress + lastChar;
                }

                // 情况4：防止安卓把刚刚写对的字重复提交到下一格
                if (
                    rawVal &&
                    l5Progress.endsWith(rawVal)
                ) {
                    isDuplicateSubmit = true;
                }
            }
        }

        if (candidateProgress !== null) {
            if (
                bestProgress === null ||
                candidateProgress.length > bestProgress.length
            ) {
                bestProgress = candidateProgress;
            }
        }
    });

    if (bestProgress !== null) {
        if (bestProgress.length > l5Progress.length) {
            if (l5StartTime === null) l5StartTime = Date.now();

            if (bestProgress.length - l5Progress.length >= 3) {
                l5AutoInputCount++;
            }

            l5Progress = bestProgress;
            renderL5(l5Progress.length);
        }

        // 延迟同步，避免在安卓 compositionupdate 中立刻改 value，打断输入法
        setTimeout(() => {
            if (currentLevel === 5) {
                ghostInput.value = l5Progress;
            }
        }, 0);

        if (l5Progress.length >= l5FullAnswer.length) {
            ghostInput.blur();
            triggerSuccess();
        }

        return;
    }

    // 如果只是安卓重复提交刚才那个字，不算错，也不报警
    if (isDuplicateSubmit) {
        setTimeout(() => {
            if (currentLevel === 5) {
                ghostInput.value = l5Progress;
            }
        }, 0);
        return;
    }

    // 真正写错：静默撤回
    if (countError) {
        l5TotalErrors++;
    }

    setTimeout(() => {
        if (currentLevel === 5) {
            ghostInput.value = l5Progress;
        }
    }, 0);
}
        // —— 数据出口（MVP 阶段只在内存整理，不接任何存储）——
        // 将来接 localStorage / 云端时，只需在收尾处把本对象存走，引擎无需改动。
        function buildL5Result() {
            return {
                piece: "兰亭集序",
                author: "王羲之",
                mode: "手写全文默写",
                finishedAt: new Date().toISOString(),

                totalErrors: l5TotalErrors,           // 本次静默判错总次数

            };

        // ⚡ 临时测试函数：免手写全篇，直接模拟"默写达成"以调试结尾。定稿后连同按钮一并删除。
        function l5TestFinish() {

        function fireConfetti() {
            // 保护：confetti 出任何问题都不得中断调用它的后续逻辑（如报告按钮显示）
            if (typeof confetti !== 'function') return;
            try {
                var end = Date.now() + 3500;
                (function frame() {
                    confetti({ particleCount: 5, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#6b8e23', '#f4a460', '#4682b4', '#d9534f'] });
                    confetti({ particleCount: 5, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#6b8e23', '#f4a460', '#4682b4', '#d9534f'] });
                    if (Date.now() < end) requestAnimationFrame(frame);
                }());
            } catch (e) { /* 礼花失败不影响主流程 */ }
        }

        // 中心爆发式礼花（用于"默写达成"成就时刻）：只炸一次，碎片慢速飘落约 4 秒
        function fireConfettiBurst() {
            if (typeof confetti !== 'function') return;
            try {
                const colors = ['#6b8e23', '#f4a460', '#4682b4', '#d9534f', '#9b59b6'];
                // 一次性放出大量粒子（保留"砰"的绽放感）；
                // gravity 调小 + decay 调高 + ticks 拉长 → 彩带散开后缓缓飘落、滞空更久。
                confetti({
                    particleCount: 200,
                    spread: 130,
                    startVelocity: 45,
                    gravity: 0.02,      // 重力极小 → 彩带几乎悬浮、缓缓飘落
                    decay: 0.94,        // 衰减更慢 → 一路飘、不中途停
                    ticks: 560,         // 粒子寿命拉长
                    scalar: 1.05,
                    origin: { x: 0.5, y: 0.5 },
                    colors
                });
            } catch (e) {}
        }

        initLevel(1);
    </script>
</body>
</html>
