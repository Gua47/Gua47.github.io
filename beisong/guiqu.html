    <script src="https://cdnjs.cloudflare.com/ajax/libs/canvas-confetti/1.6.0/confetti.browser.min.js"></script>

    <script>
    // 兜底：CDN 未加载 confetti 时，用内嵌轻量礼花，保证礼花一定能动且不中断后续逻辑
    if (typeof window.confetti === 'undefined') {
        window.confetti = function (opts) {
            opts = opts || {};
            const count = opts.particleCount || 30;
            const spread = opts.spread || 60;
            const angle = (opts.angle != null ? opts.angle : 90) * Math.PI / 180;
            const origin = opts.origin || { x: 0.5, y: 0.5 };
            const colors = opts.colors || ['#6a8b47', '#f4a460', '#4682b4', '#d9534f', '#9b59b6'];
            const cv = document.createElement('canvas');
            cv.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9999;';
            cv.width = window.innerWidth; cv.height = window.innerHeight;
            document.body.appendChild(cv);
            const ctx = cv.getContext('2d');
            const ps = [];
            for (let i = 0; i < count; i++) {
                const a = angle + (Math.random() - 0.5) * (spread * Math.PI / 180);
                const v = 6 + Math.random() * 8;
                ps.push({ x: origin.x * cv.width, y: origin.y * cv.height, vx: Math.cos(a) * v, vy: -Math.sin(a) * v, g: 0.04 + Math.random() * 0.04, s: 5 + Math.random() * 5, life: 200 + Math.random() * 80, c: colors[Math.floor(Math.random() * colors.length)], rot: Math.random() * 6, vr: (Math.random() - 0.5) * 0.4 });
            }
            let frame = 0;
            (function loop() {
                ctx.clearRect(0, 0, cv.width, cv.height);
                let alive = false;
                ps.forEach(p => {
                    if (p.life <= 0) return;
                    alive = true;
                    p.vy += p.g; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life--;
                    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
                    ctx.globalAlpha = Math.max(0, p.life / 80);
                    ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * 0.6);
                    ctx.restore();
                });
                frame++;
                if (alive && frame < 600) requestAnimationFrame(loop);
                else cv.remove();
            })();
        };
    }
    </script>

            { text: "余家贫，耕植不足以自给。幼稚盈室，瓶无储粟，生生所资，未见其术。亲故多劝余为长吏，脱然有怀，求之靡途。会有四方之事，诸侯以惠爱为德，家叔以余贫苦，遂见用于小邑。",
              trans: "我家境贫寒，耕田种地不能够维持自己的生活。孩子满屋，米缸里没有存粮，维持生活所需的物资，没有办法解决。亲友大都劝我去做官，我心里也有这个念头，可是求官缺少门路。正赶上出使到外地的事情，地方大吏以爱惜人才为美德，叔父因为我贫苦困顿，于是举荐我，我就被任命到小县做官。" },
            { text: "于时风波未静，心惮远役，彭泽去家百里，公田之利，足以为酒。故便求之。及少日，眷然有归欤之情。何则？质性自然，非矫厉所得。饥冻虽切，违己交病。尝从人事，皆口腹自役。于是怅然慷慨，深愧平生之志。犹望一稔，当敛裳宵逝。",
              trans: "那时战乱还没有平息，心里害怕到远方服役。彭泽县离家一百里，公田收获的粮食，足够用来酿酒，所以我就请求到那里任职。没过多久，就产生了怀念田园想要回家的心情。为什么呢？本性任其自然，勉强克制是办不到的。饥寒虽然来得急迫，但是违背本心做官，身心都感到痛苦。曾经出仕做官，都是为了糊口而役使自己。于是惆怅感慨，深深有愧于平生的志愿。只再等到秋收一熟，便收拾行李连夜离去。" },
            { text: "寻程氏妹丧于武昌，情在骏奔，自免去职。仲秋至冬，在官八十余日。因事顺心，命篇曰《归去来兮》。乙巳岁十一月也。",
              trans: "不久，嫁到程家的妹妹在武昌去世，我急于奔丧，于是主动辞去官职。从仲秋入冬，一共在职八十多天。顺应本心抒发情志，写下这篇文章，取名为《归去来兮》。乙巳年十一月。" },
            { text: "归去来兮，田园将芜胡不归？既自以心为形役，奚惆怅而独悲？悟已往之不谏，知来者之可追。实迷途其未远，觉今是而昨非。舟遥遥以轻飏，风飘飘而吹衣。问征夫以前路，恨晨光之熹微。",
              trans: "回家去吧！田园快要荒芜了，为什么不回去呢？既然自己让内心被形体所驱使，为什么还要失意惆怅独自悲伤？认识到过去的错误已经不可挽回，知道未来的事还来得及补救。确实走入迷途还不算太远，已经觉悟到今天辞官是正确的，往日出仕是错误的。船在水面上轻轻飘荡前进，微风徐徐吹动衣衫。向行人打听前面的道路，只遗憾天色朦胧，晨光还太微弱。" },
            { text: "乃瞻衡宇，载欣载奔。僮仆欢迎，稚子候门。三径就荒，松菊犹存。携幼入室，有酒盈樽。引壶觞以自酌，眄庭柯以怡颜。倚南窗以寄傲，审容膝之易安。园日涉以成趣，门虽设而常关。策扶老以流憩，时矫首而遐观。云无心以出岫，鸟倦飞而知还。景翳翳以将入，抚孤松而盘桓。",
              trans: "刚刚望见自家简陋的宅院，心中欢喜，快步向前奔跑。家仆欢喜地出来迎接，年幼的孩子们守在门口等候。院子里的小路快要荒芜，松树菊花还好好长在那里。拉着孩子走进屋内，酒樽里已经斟满美酒。拿起酒壶自斟自饮，观赏院中树木，喜上眉梢。靠着南窗寄托傲岸的情怀，深知这狭小的居室也足以使人安适。每天在园中散步，自有乐趣，大门虽然安设却常常紧闭。拄着拐杖走走歇歇，时时抬头向远方眺望。云朵自然而然地从山洞飘出，鸟儿飞倦了也知道飞回巢穴。日光渐渐暗淡，太阳即将落山，我仍手抚孤松，徘徊流连。" },
            { text: "归去来兮，请息交以绝游。世与我而相违，复驾言兮焉求？悦亲戚之情话，乐琴书以消忧。农人告余以春及，将有事于西畴。或命巾车，或棹孤舟。既窈窕以寻壑，亦崎岖而经丘。木欣欣以向荣，泉涓涓而始流。善万物之得时，感吾生之行休。",
              trans: "回家去吧！让我断绝同官场人士的交游。世事与我的本心相悖，我还要驾车出游，去追求什么呢？喜欢听亲友们知心的闲谈，以弹琴读书消解忧愁。农夫告诉我春天已经来临，将要到西边田里去春耕。有时坐着有帷幕的小车，有时划着一叶小舟。既探寻幽深曲折的山沟，也走过高低不平的山丘。树木欣欣向荣，泉水缓缓流动。我羡慕万物恰逢大好时节，感叹自己的生命快要走到尽头。" },
            { text: "已矣乎！寓形宇内复几时？曷不委心任去留？胡为乎遑遑欲何之？富贵非吾愿，帝乡不可期。怀良辰以孤往，或植杖而耘耔。登东皋以舒啸，临清流而赋诗。聊乘化以归尽，乐夫天命复奚疑！",
              trans: "算了吧！身体寄托在天地间还能有多少时日？为什么不随心所欲，听凭自然地生死？为什么心神不定，还想去什么地方？荣华富贵不是我的追求，神仙世界也无法期许。趁着大好时光独自出游，有时扶着拐杖除草培苗。登上东边的高地放声长啸，面对着清澈的溪水吟咏诗篇。姑且顺应自然直到生命终结，乐天安命，还有什么疑虑呢！" }
        ];

        const fullTextStr = rawParas.join("");
        // 标点过滤表：已新增单引号 ‘ ’（多层引号嵌套）
        const puncRegex = /[，。；？、〔〕“”‘’\s！!：:《》〈〉（）()]/;
        const charPool = [...new Set(fullTextStr.replace(new RegExp(puncRegex, 'g'), "").split(''))];
        const l5IsIOS = /iP(ad|hone|od)/.test(navigator.platform) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        const l5IsAndroid = /Android/i.test(navigator.userAgent);

        // 第1-3关易错字混淆表（本篇专属；精准干扰优先，不足随机补足）
        const confusionMap = {
            "飏": ["扬"],
            "岫": ["袖"],
            "畴": ["筹"],
            "皋": ["高"],
            "耘": ["耕"],
            "觞": ["殇"]
        };

        let currentLevel = 1;
        let allBlanks = [];
        let activeIndex = 0;
        let globalErrorCount = 0;

        function goToLevel(l) {
            ['summary-overlay','success-page','achievement-page','seg-summary'].forEach(id => document.getElementById(id).style.display = 'none');
            currentLevel = l;
            initLevel(l);
        }

        function handleGlobalError() {
            globalErrorCount++;
            if (globalErrorCount >= 20 && currentLevel <= 3) {
                setTimeout(() => {
                    alert("哎呀，遇到瓶颈啦！本关已失误 15 次。“温故而知新”，先退回上一关稳扎稳打吧！");
                    goToLevel(currentLevel > 1 ? currentLevel - 1 : 1);
                }, 100);
            }
        }

        function initLevel(level) {
            globalErrorCount = 0;
            const body = document.getElementById('content-body');
            const l4Container = document.getElementById('l4-container');
            const opts = document.getElementById('options-container');
            const ghostInput = document.getElementById('ghost-input');

            body.innerHTML = '';
            body.style.display = 'block';
            l4Container.style.display = 'none';
            opts.style.display = 'none';
            ghostInput.style.display = 'none';
            ghostInput.value = '';
            document.body.classList.toggle('l5-ios-input', level === 5 && l5IsIOS);
            document.body.classList.toggle('l5-android-input', level === 5 && l5IsAndroid);
            document.getElementById('l5-tip-toast').style.display = 'none';
            document.getElementById('l5-hint-btn').style.display = 'none';
            document.getElementById('seg-hint').innerText = '';
            allBlanks = [];
            activeIndex = 0;

            document.getElementById('level-title').innerText = level === 5 ? "终极测评" : `正在练习：第${level}关`;
            document.querySelectorAll('.node').forEach((n, i) => n.classList.toggle('active', i < level));
            document.getElementById('progress-active').style.width = (level - 1) * 25 + '%';

            if (level <= 3) {
                opts.style.display = 'flex';
                renderStandardBody(level);
                refreshUI_L1to3();
            } else if (level === 4) {
                body.style.display = 'none';
                l4Container.style.display = 'flex';
                initL4();
            } else if (level === 5) {
                ghostInput.style.display = 'block';
                document.getElementById('l5-hint-btn').style.display = 'block';
                initL5();
            }
        }

        // ===== 第1-3关：整篇连续挖空 + 易错字干扰 =====
        function renderStandardBody(level) {
            const body = document.getElementById('content-body');
            const gapRate = [0.4, 0.6, 0.8][level - 1];
            rawParas.forEach((para) => {
                const p = document.createElement('p');
                p.className = 'content-para';
                para.split('').forEach(char => {
                    if (puncRegex.test(char)) {
                        p.appendChild(document.createTextNode(char));
                    } else if (Math.random() < gapRate) {
                        const span = document.createElement('span');
                        span.className = 'blank';
                        span.dataset.ans = char;
                        span.innerText = char;
                        p.appendChild(span);
                        allBlanks.push(span);
                    } else {
                        p.appendChild(document.createTextNode(char));
                    }
                });
                body.appendChild(p);
            });
        }

        function refreshUI_L1to3() {
            if (activeIndex >= allBlanks.length) { triggerSuccess(); return; }
            allBlanks.forEach((b, i) => {
                b.classList.remove('active');
                if (i === activeIndex) { b.classList.add('active'); b.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
            });
            const correctChar = allBlanks[activeIndex].dataset.ans;
            const preset = (confusionMap[correctChar] || []).filter(c => c !== correctChar);
            const need = 3 - preset.length;
            const used = new Set([correctChar, ...preset]);
            const randomFill = charPool.filter(c => !used.has(c)).sort(() => Math.random() - 0.5).slice(0, Math.max(0, need));
            const options = [correctChar, ...preset, ...randomFill].sort(() => Math.random() - 0.5);

            const optsContainer = document.getElementById('options-container');
            optsContainer.innerHTML = '';
            options.forEach(char => {
                const btn = document.createElement('div');
                btn.className = 'option-btn';
                btn.innerText = char;
                btn.onclick = () => {
                    if (char === correctChar) {
                        allBlanks[activeIndex].innerText = char;
                        allBlanks[activeIndex].className = 'blank filled';
                        activeIndex++;
                        refreshUI_L1to3();
                    } else {
                        allBlanks[activeIndex].classList.add('wrong');
                        setTimeout(() => allBlanks[activeIndex].classList.remove('wrong'), 400);
                        handleGlobalError();
                    }
                };
                optsContainer.appendChild(btn);
            });
        }

        // ===== 第4关：分段录入核对（七段，段末小结，可反复练，不计时）=====
        let l4SegIndex = 0;
        let l4ParaData = [];
        let l4SavedText = [];
        let l4Completed = [];

        function initL4() {
            l4SegIndex = 0;
            l4SavedText = new Array(segments.length).fill("");
            l4Completed = new Array(segments.length).fill(false);
            buildL4Select();
            renderL4Seg();
        }

        function buildL4Select() {
            const sel = document.getElementById('l4-seg-select');
            sel.innerHTML = '';
            segments.forEach((_, i) => {
                const opt = document.createElement('option');
                opt.value = i;
                opt.innerText = (l4Completed[i] ? '✅ ' : '') + `第 ${i + 1} / ${segments.length} 段`;
                sel.appendChild(opt);
            });
            sel.value = l4SegIndex;
            sel.onchange = (e) => { l4SegIndex = parseInt(e.target.value); renderL4Seg(); };
        }

        function renderL4Seg() {
            buildL4Select();
            document.getElementById('l4-seg-hint').innerText = `第 ${l4SegIndex + 1} / ${segments.length} 段（可在上方下拉框自由选段反复练）`;
            document.getElementById('l4-trans').innerText = "译文参考：" + segments[l4SegIndex].trans;
            document.getElementById('l4-textarea').style.display = 'block';
            document.getElementById('l4-textarea').value = l4SavedText[l4SegIndex];
            document.getElementById('l4-result-area').style.display = 'none';
            document.getElementById('l4-check-btn').style.display = 'block';
            document.getElementById('l4-reedit-btn').style.display = 'none';
        }

        function reeditL4Seg() {
            document.getElementById('l4-textarea').style.display = 'block';
            document.getElementById('l4-check-btn').style.display = 'block';
            document.getElementById('l4-result-area').style.display = 'none';
            document.getElementById('l4-reedit-btn').style.display = 'none';
            document.getElementById('l4-textarea').value = l4SavedText[l4SegIndex];
            document.getElementById('l4-textarea').focus();
        }

        function checkL4Seg() {
            const raw = segments[l4SegIndex].text;
            const inputVal = document.getElementById('l4-textarea').value;
            l4SavedText[l4SegIndex] = inputVal;
            const inputChinese = inputVal.replace(new RegExp(puncRegex, 'g'), "").split('');
            if (inputChinese.length === 0) { alert("输入为空，请先录入本段内容。"); return; }

            l4ParaData = [];
            let ptr = 0;
            raw.split('').forEach(char => {
                if (puncRegex.test(char)) {
                    l4ParaData.push({ isPunct: true, char });
                } else {
                    const userChar = ptr < inputChinese.length ? inputChinese[ptr] : "";
                    l4ParaData.push({ isPunct: false, targetChar: char, userChar, isCorrect: userChar === char });
                    ptr++;
                }
            });
            document.getElementById('l4-textarea').style.display = 'none';
            document.getElementById('l4-check-btn').style.display = 'none';
            document.getElementById('l4-reedit-btn').style.display = 'block';
            renderL4Result();
        }

        function renderL4Result() {
            const area = document.getElementById('l4-result-area');
            area.style.display = 'block';
            area.innerHTML = '';
            let allCorrect = true;
            l4ParaData.forEach((item, index) => {
                if (item.isPunct) { area.appendChild(document.createTextNode(item.char)); return; }
                const span = document.createElement('span');
                span.dataset.index = index;
                if (item.isCorrect) { span.className = 'l4-char-green'; span.innerText = item.targetChar; }
                else {
                    allCorrect = false;
                    span.className = item.userChar ? 'l4-char-red' : 'l4-char-miss';
                    span.innerText = item.userChar || "空";
                    span.onclick = () => openL4Inline(index, span);
                }
                area.appendChild(span);
            });
            if (allCorrect) {
                setTimeout(() => {
                    document.getElementById('l4-reedit-btn').style.display = 'none';
                    l4Completed[l4SegIndex] = true;
                    showSegSummary(4, l4SegIndex, null);
                }, 300);
            }
        }

        function openL4Inline(index, spanNode) {
            const input = document.createElement('input');
            input.type = 'text'; input.className = 'l4-inline-input';
            input.setAttribute('autocomplete','off'); input.setAttribute('autocorrect','off'); input.setAttribute('spellcheck','false');
            spanNode.parentNode.replaceChild(input, spanNode);
            input.focus();
            input.oninput = () => {
                const val = input.value.replace(new RegExp(puncRegex, 'g'), "");
                if (val.length >= 1) checkL4Inline(index, val[val.length - 1], input);
            };
        }

        function checkL4Inline(index, val, inputNode) {
            if (val === l4ParaData[index].targetChar) {
                l4ParaData[index].userChar = val;
                l4ParaData[index].isCorrect = true;
                renderL4Result();
            } else {
                inputNode.value = '';
                inputNode.classList.add('wrong');
                setTimeout(() => inputNode.classList.remove('wrong'), 400);
            }
        }

        // ===== 第5关：手写静默 + 七段闯关 =====
        const cjkRegex = /[\u3400-\u4dbf\u4e00-\u9fff\uf900-\ufaff]/g;
        let l5SegIndex = 0;
        let l5SegAnswer = "";
        let l5SegProgress = "";
        let l5SegBlanks = [];
        let l5SegStart = null;          // 本次尝试起点（写下第一个字才开始）
        let l5BestTimes = [];           // 每段最快用时（秒）
        let l5TotalErrors = 0;
        let l5Composing = false;
        let l5GhostBound = false;

        function focusL5Ghost() {
            if (currentLevel !== 5) return;
            const segSummaryOpen = document.getElementById('seg-summary').style.display === 'flex';
            const achievementOpen = document.getElementById('achievement-page').style.display === 'flex';
            const reportOpen = document.getElementById('summary-overlay').style.display === 'block';
            if (segSummaryOpen || achievementOpen || reportOpen) return;
            const gi = document.getElementById('ghost-input');
            if (!gi || gi.style.display === 'none') return;
            try {
                gi.focus({ preventScroll: true });
            } catch (e) {
                gi.focus();
            }
            if (document.activeElement === gi && typeof gi.setSelectionRange === 'function') {
                const end = gi.value.length;
                try { gi.setSelectionRange(end, end); } catch (e) {}
            }
        }

        function syncL5GhostValue() {
            const gi = document.getElementById('ghost-input');
            gi.value = l5IsIOS ? '' : l5SegProgress;
            if (typeof gi.setSelectionRange === 'function') {
                const end = gi.value.length;
                try { gi.setSelectionRange(end, end); } catch (e) {}
            }
        }

        function scrollL5ActiveBlank(el) {
            if (l5IsIOS) {
                el.scrollIntoView({ behavior: 'auto', block: 'nearest', inline: 'nearest' });
                setTimeout(focusL5Ghost, 0);
            } else {
                el.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }

        function initL5() {
            l5SegIndex = 0;
            l5BestTimes = new Array(segments.length).fill(null);
            l5TotalErrors = 0;
            bindGhostInput();
            loadL5Seg();
        }

        function loadL5Seg() {
            const body = document.getElementById('content-body');
            body.innerHTML = '';
            l5SegBlanks = [];
            l5SegProgress = "";
            l5SegStart = null;
            document.getElementById('seg-hint').innerHTML = `终极测评 · 第 ${l5SegIndex + 1} / ${segments.length} 段（手写输入）<div class="l5-subtip">✍️ 一鼓作气完成，中途离开则计时重置<br><span class="l5-subtip-weak">（可反复练习，只计最短用时）</span></div>`;

            const segText = segments[l5SegIndex].text;
            l5SegAnswer = segText.replace(new RegExp(puncRegex, 'g'), "");
            const p = document.createElement('p');
            p.className = 'content-para';
            segText.split('').forEach(char => {
                if (puncRegex.test(char)) { p.appendChild(document.createTextNode(char)); return; }
                const span = document.createElement('span');
                span.className = 'blank';
                span.dataset.ans = char;
                span.innerText = char;
                p.appendChild(span);
                l5SegBlanks.push(span);
            });
            body.appendChild(p);
            renderL5Seg(0);
            const gi = document.getElementById('ghost-input');
            gi.value = '';
            focusL5Ghost();
            setTimeout(focusL5Ghost, 200);
        }

        function renderL5Seg(progressLen) {
            l5SegBlanks.forEach((b, i) => {
                b.classList.remove('active', 'wrong');
                if (i < progressLen) {
                    b.className = 'blank filled'; b.style.color = ''; b.innerText = b.dataset.ans;
                } else {
                    b.className = 'blank'; b.style.color = ''; b.innerText = b.dataset.ans;
                    if (i === progressLen) { b.classList.add('active'); scrollL5ActiveBlank(b); }
                }
            });
        }

        function bindGhostInput() {
    const gi = document.getElementById('ghost-input');
    const gameArea = document.getElementById('game-area');

    if (l5GhostBound) return;
    l5GhostBound = true;

    gameArea.onclick = () => {
        focusL5Ghost();
    };

    gameArea.ontouchend = () => {
        focusL5Ghost();
    };

    gi.oncompositionstart = () => {
        l5Composing = true;
    };

    gi.oncompositionupdate = (e) => {
        if (!l5IsIOS) {
            validateL5(e.data || "", { countError: false });
        }
    };

    gi.oncompositionend = (e) => {
        l5Composing = false;
        validateL5(e.data || "");
    };

    gi.oninput = (e) => {
        if (l5IsIOS && l5Composing) return;
        validateL5(e.data || "");
    };

    gi.onblur = () => {
        if (!l5IsIOS || currentLevel !== 5) return;
        const segSummaryOpen = document.getElementById('seg-summary').style.display === 'flex';
        const achievementOpen = document.getElementById('achievement-page').style.display === 'flex';
        const reportOpen = document.getElementById('summary-overlay').style.display === 'block';
        if (!segSummaryOpen && !achievementOpen && !reportOpen) {
            setTimeout(focusL5Ghost, 80);
        }
    };
}
      function validateL5(extraText = "", options = {}) {
    if (currentLevel !== 5) return;

    const gi = document.getElementById('ghost-input');
    const countError = options.countError !== false;

    const fromInput = (gi.value.match(cjkRegex) || []).join("");
    const fromEvent = (String(extraText).match(cjkRegex) || []).join("");

    const candidates = [];
    if (fromInput) candidates.push(fromInput);
    if (fromEvent) candidates.push(fromEvent);

    if (fromInput && fromEvent && fromInput !== fromEvent) {
        candidates.push(fromInput + fromEvent);
    }

    if (candidates.length === 0) {
        syncL5GhostValue();
        return;
    }

    let bestProgress = null;
    let isDuplicateSubmit = false;

    candidates.forEach(rawVal => {
        let candidateProgress = null;

        if (l5SegAnswer.startsWith(rawVal)) {
            if (rawVal.length >= l5SegProgress.length) {
                candidateProgress = rawVal;
            }
        } else {
            const remainder = l5SegAnswer.substring(l5SegProgress.length);

            if (remainder.startsWith(rawVal)) {
                candidateProgress = l5SegProgress + rawVal;
            } else {
                const lastChar = rawVal.charAt(rawVal.length - 1);
                const expectedChar = l5SegAnswer.charAt(l5SegProgress.length);

                if (lastChar === expectedChar) {
                    candidateProgress = l5SegProgress + lastChar;
                }

                if (rawVal && l5SegProgress.endsWith(rawVal)) {
                    isDuplicateSubmit = true;
                }
            }
        }

        if (candidateProgress !== null) {
            if (
                bestProgress === null ||
                candidateProgress.length > bestProgress.length
            ) {
                bestProgress = candidateProgress;
            }
        }
    });

    if (bestProgress !== null) {
        if (bestProgress.length > l5SegProgress.length) {
            if (l5SegStart === null) {
                l5SegStart = Date.now();
            }

            l5SegProgress = bestProgress;
            renderL5Seg(l5SegProgress.length);
        }

        setTimeout(() => {
            if (currentLevel === 5) {
                syncL5GhostValue();
                focusL5Ghost();
            }
        }, 0);

        if (l5SegProgress.length >= l5SegAnswer.length) {
            gi.blur();

            const attemptSec = l5SegStart
                ? Math.round((Date.now() - l5SegStart) / 1000)
                : 0;

            if (
                l5BestTimes[l5SegIndex] === null ||
                attemptSec < l5BestTimes[l5SegIndex]
            ) {
                l5BestTimes[l5SegIndex] = attemptSec;
            }

            showSegSummary(5, l5SegIndex, l5BestTimes[l5SegIndex]);
        }

        return;
    }

    if (isDuplicateSubmit) {
        setTimeout(() => {
            if (currentLevel === 5) {
                syncL5GhostValue();
                focusL5Ghost();
            }
        }, 0);
        return;
    }

    if (countError) {
        l5TotalErrors++;
    }

    setTimeout(() => {
        if (currentLevel === 5) {
            syncL5GhostValue();
            focusL5Ghost();
        }
    }, 0);
}  
        // 提示：只显示当前该填的一个字（保住记忆点）
        function showL5Hint() {
            if (currentLevel !== 5) return;
            const nextChar = l5SegAnswer.charAt(l5SegProgress.length);
            if (!nextChar) return;
            const toast = document.getElementById('l5-tip-toast');
            toast.innerText = `💡 下一个字：「${nextChar}」`;
            toast.style.display = 'block';
            clearTimeout(toast._t);
            toast._t = setTimeout(() => { toast.style.display = 'none'; }, 2000);
        }

        // ===== 段末小结页（第4、5关共用）=====
        let segSummaryLevel = 4;
        function showSegSummary(level, segIndex, bestSec) {
            segSummaryLevel = level;
            const page = document.getElementById('seg-summary');
            const title = document.getElementById('seg-summary-title');
            const timeEl = document.getElementById('seg-summary-time');
            const nextBtn = document.getElementById('seg-next-btn');
            const redoBtn = document.getElementById('seg-redo-btn');

            const isLast = segIndex === segments.length - 1;
            title.innerText = `第 ${segIndex + 1} 段 · 完成 🎉`;

            if (level === 5) {
                const m = Math.floor(bestSec / 60), s = bestSec % 60;
                timeEl.innerHTML = `本段最快用时：<strong>${m > 0 ? m + ' 分 ' : ''}${s} 秒</strong>`;
                redoBtn.style.display = 'block';
            } else {
                timeEl.innerHTML = `本段录入核对无误，继续保持！`;
                redoBtn.style.display = 'block';
            }

            nextBtn.innerText = isLast
                ? (level === 5 ? '🏅 完成全篇 · 查看成就' : '✅ 完成本板块')
                : '进入下一段';
            page.style.display = 'flex';
        }

        function segGoNext() {
            document.getElementById('seg-summary').style.display = 'none';
            const isLast = (segSummaryLevel === 5 ? l5SegIndex : l4SegIndex) === segments.length - 1;
            if (segSummaryLevel === 5) {
                if (isLast) { showAchievementCard(); return; }
                l5SegIndex++;
                loadL5Seg();
            } else {
                if (isLast) { triggerL4Done(); return; }
                l4SegIndex++;
                renderL4Seg();
            }
        }

        function segRedo() {
            document.getElementById('seg-summary').style.display = 'none';
            if (segSummaryLevel === 5) {
                loadL5Seg();   // 重练本段：进度清零、计时重置；最快用时已保留
            } else {
                l4SavedText[l4SegIndex] = "";
                renderL4Seg();
            }
        }

        function triggerL4Done() {
            const modal = document.getElementById('success-page');
            document.getElementById('success-title').innerText = "第四关完成🎉";
            document.getElementById('success-desc').innerText = "七段语音默写全部通过，可以进入终极测评了。";
            document.getElementById('success-next-btn').innerText = "进入终极测评";
            modal.style.display = 'flex';
            fireConfetti();
        }

        // ===== 成功页（第1-3关）=====
        function triggerSuccess() {
            const modal = document.getElementById('success-page');
            document.getElementById('success-title').innerText = "挑战成功🎉";
            document.getElementById('success-desc').innerText = "百尺竿头，更进一步";
            document.getElementById('success-next-btn').innerText = "进入下一关";
            modal.style.display = 'flex';
            fireConfetti();
        }

        function closeSuccessPage() {
            document.getElementById('success-page').style.display = 'none';
            if (currentLevel < 5) goToLevel(currentLevel + 1);
        }

        // ===== 成就卡 =====
        function showAchievementCard() {
            const totalSec = l5BestTimes.reduce((a, b) => a + (b || 0), 0);
            const m = Math.floor(totalSec / 60), s = totalSec % 60;
            document.getElementById('ac-time-val').innerText = m > 0 ? `${m} 分 ${s} 秒` : `${s} 秒`;
            const now = new Date(), pad = n => String(n).padStart(2, '0');
            document.getElementById('ac-date').innerText = `${now.getFullYear()}.${pad(now.getMonth()+1)}.${pad(now.getDate())}`;
            document.getElementById('achievement-page').style.display = 'flex';
            fireConfettiBurst();
        }

        function openReportFromCard() {
            document.getElementById('achievement-page').style.display = 'none';
            showReport();
        }

        function backToAchievement() {
            document.getElementById('summary-overlay').style.display = 'none';
            document.getElementById('achievement-page').style.display = 'flex';
        }

        function saveAchievementCard() {
            const el = document.getElementById('achievement-card');
            const btn = document.getElementById('ac-save-btn');
            if (typeof html2canvas !== 'function') { alert('图片组件未加载，请检查网络后重试'); return; }
            const orig = btn.innerHTML;
            btn.innerHTML = '⏳ 正在生成…'; btn.style.opacity = '0.7'; btn.disabled = true;
            html2canvas(el, { scale: 2, backgroundColor: null }).then(canvas => {
                const link = document.createElement('a');
                link.download = '归去来兮辞-成就卡.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
                btn.innerHTML = '✅ 已保存';
                setTimeout(() => { btn.innerHTML = orig; btn.style.opacity = '1'; btn.disabled = false; }, 2000);
            }).catch(() => { alert('生成失败，请重试'); btn.innerHTML = orig; btn.style.opacity = '1'; btn.disabled = false; });
        }

        // ===== 报告页 =====
        function showReport() {
            const overlay = document.getElementById('summary-overlay');
            const evalDiv = document.getElementById('summary-eval');
            const textContainer = document.getElementById('report-text-container');
            overlay.style.display = 'block';
            textContainer.innerHTML = '';
            const totalSec = l5BestTimes.reduce((a, b) => a + (b || 0), 0);
            const m = Math.floor(totalSec / 60), s = totalSec % 60;
            const timeStr = (m > 0 ? m + ' 分 ' : '') + s + ' 秒';

            if (l5TotalErrors === 0) {
                evalDiv.innerHTML = `<strong>惊为天人！</strong><br>全程顺畅、一次未卡，用时 ${timeStr}。`;
                evalDiv.style.color = "var(--primary-color)";
            } else if (l5TotalErrors <= 12) {
                evalDiv.innerHTML = `全篇默写达成，用时 ${timeStr}，共 ${l5TotalErrors} 次落笔未中。<br>瑕不掩瑜，基础非常扎实！`;
                evalDiv.style.color = "var(--primary-color)";
            } else {
                evalDiv.innerHTML = `全篇默写达成，用时 ${timeStr}，共 ${l5TotalErrors} 次落笔未中。<br>建议对照原文复看卡顿处，再练一遍。`;
                evalDiv.style.color = "var(--text-color)";
            }
            rawParas.forEach(para => {
                const p = document.createElement('p');
                p.className = 'report-para';
                p.innerText = para;
                textContainer.appendChild(p);
            });
        }

        function downloadReport() {
            const element = document.getElementById('report-capture-area');
            const btn = document.getElementById('download-btn');
            if (typeof html2canvas !== 'function') { alert('图片组件未加载，请检查网络后重试'); return; }
            const origText = btn.innerHTML;
            btn.innerHTML = "⏳ 正在生成长图…"; btn.style.opacity = '0.7'; btn.disabled = true;
            html2canvas(element, { scale: 2, backgroundColor: "#fff" }).then(canvas => {
                const link = document.createElement('a');
                link.download = '归去来兮辞-默写报告.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
                btn.innerHTML = "✅ 保存成功";
                setTimeout(() => { btn.innerHTML = origText; btn.style.opacity = '1'; btn.disabled = false; }, 2000);
            }).catch(() => { alert("生成图片失败，请重试"); btn.innerHTML = origText; btn.style.opacity = '1'; btn.disabled = false; });
        }

        // ===== 礼花 =====
        function fireConfetti() {
            if (typeof confetti !== 'function') return;
            try {
                var end = Date.now() + 2500;
                (function frame() {
                    confetti({ particleCount: 5, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#6a8b47', '#f4a460', '#4682b4', '#d9534f'] });
                    confetti({ particleCount: 5, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#6a8b47', '#f4a460', '#4682b4', '#d9534f'] });
                    if (Date.now() < end) requestAnimationFrame(frame);
                }());
            } catch (e) {}
        }

        // 成就时刻：三点齐炸（彩带更大、飘落更慢更久）
        function fireConfettiBurst() {
            if (typeof confetti !== 'function') return;
            try {
                const colors = ['#6a8b47', '#f4a460', '#4682b4', '#d9534f', '#9b59b6'];
                const cfg = { particleCount: 160, spread: 120, startVelocity: 34, gravity: 0.04, decay: 0.93, ticks: 680, scalar: 2.4, colors };
                confetti({ ...cfg, origin: { x: 0.5,  y: 0.4 } });   // 主炸
                confetti({ ...cfg, origin: { x: 0.13, y: 0.6 } });   // 左辅炸
                confetti({ ...cfg, origin: { x: 0.86, y: 0.9 } });   // 右辅炸
            } catch (e) {}
        }

        initLevel(1);
    </script>
