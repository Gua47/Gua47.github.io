<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高中古文背诵闯关</title>
    <style>
        :root {
            --bg: #f4f1e6;
            --paper: #fffdf7;
            --text: #2f2f2a;
            --muted: #747067;
            --title: #8B3342;
            --pressed: #F8ECEE;
            --line: #d6d0bf;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family: "PingFang SC", "Microsoft YaHei", "STSong", serif;
        }

        .page {
            width: 100%;
            padding: 22px 14px 40px;
        }

        header {
            padding: 12px 2px 22px;
            border-bottom: 1px solid var(--line);
            margin-bottom: 22px;
        }

        h1 {
            margin: 0;
            font-size: 1.65rem;
            letter-spacing: 2px;
        }

        .section-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin: 24px 0 14px;
        }

        .section-title h2 {
            margin: 0;
            font-size: 1.15rem;
            letter-spacing: 1px;
        }

        .count {
            color: var(--muted);
            font-size: 0.9rem;
            white-space: nowrap;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }

        .card {
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-width: 0;
            min-height: 116px;
            padding: 12px;
            background: var(--paper);
            border: 1px solid var(--line);
            border-radius: 8px;
            text-decoration: none;
            color: inherit;
            box-shadow: 0 4px 14px rgba(70, 60, 35, 0.05);
            -webkit-tap-highlight-color: transparent;
            transition:
                transform 0.18s ease,
                background-color 0.18s ease,
                border-color 0.18s ease;
        }

        .card:active {
            transform: scale(0.99);
            background: var(--pressed);
            border-color: var(--title);
        }

        .card:focus-visible {
            outline: 2px solid var(--title);
            outline-offset: 3px;
        }

        .card h3 {
            margin: 0 0 8px;
            min-height: 0;
            color: var(--title);
            font-size: 18px;
            font-weight: 600;
            line-height: 1.5;
            text-align: left;
            overflow-wrap: anywhere;
        }

        .meta {
            margin: 0;
            color: var(--muted);
            font-size: 13px;
            font-weight: 400;
            line-height: 1.5;
            text-align: left;
        }

        @media (max-width: 359px) {
            .card h3 {
                font-size: 16px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .card {
                transition: none;
            }

            .card:active {
                transform: none;
            }
        }
    </style>
</head>
<body>
    <main class="page">
        <header>
            <h1>高中古文背诵闯关</h1>
        </header>

        <section aria-labelledby="section-title">
            <div class="section-title">
                <h2 id="section-title">选择性必修下</h2>
                <span class="count">共6篇</span>
            </div>

            <div class="grid">
                <a class="card" href="./chenqing.html">
                    <h3>陈情表</h3>
                    <p class="meta">李密〔西晋〕</p>
                </a>

                <a class="card" href="./xiangji.html">
                    <h3>项脊轩志</h3>
                    <p class="meta">归有光〔明〕</p>
                </a>

                <a class="card" href="./lanting.html">
                    <h3>兰亭集序</h3>
                    <p class="meta">王羲之〔东晋〕</p>
                </a>

                <a class="card" href="./guiqu.html">
                    <h3>归去来兮辞</h3>
                    <p class="meta">陶渊明〔东晋〕</p>
                </a>

                <a class="card" href="./zhongshu.html">
                    <h3>种树郭橐驼传</h3>
                    <p class="meta">柳宗元〔唐〕</p>
                </a>

                <a class="card" href="./shizhong.html">
                    <h3>石钟山记</h3>
                    <p class="meta">苏轼〔北宋〕</p>
                </a>
            </div>
        </section>
    </main>
</body>
</html>
